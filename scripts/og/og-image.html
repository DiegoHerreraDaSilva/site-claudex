<!doctype html>
<!-- Fonte da imagem public/og-image.png (1200x630). Regere com o comando descrito em docs/SEO.md. -->
<html lang="pt-BR"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:#f1f5f1;background:#0a1012;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 78% 40%,#1b4a45 0,transparent 55%),radial-gradient(circle at 10% 110%,#16323a 0,transparent 50%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:60px 60px}
.wrap{position:relative;height:100%;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px;font-weight:700;font-size:30px;letter-spacing:.14em}
.brand img{width:64px;height:64px;border-radius:14px}
h1{font-size:68px;line-height:1.04;letter-spacing:-.035em;font-weight:700;max-width:760px}
h1 span{color:#5fe0c8}
.chips{display:flex;gap:14px}
.chip{font-family:Consolas,monospace;font-size:20px;font-weight:600;padding:12px 20px;border-radius:30px;border:2px solid}
.c1{color:#7fe0b0;border-color:#7fe0b088;background:#7fe0b01a}.c2{color:#7db8ff;border-color:#7db8ff88;background:#7db8ff1a}.c3{color:#c3a6ff;border-color:#c3a6ff88;background:#c3a6ff1a}
.big{position:absolute;right:70px;top:150px;width:330px;height:330px;border-radius:70px;filter:drop-shadow(0 0 60px #2fd3b866)}
.url{position:absolute;right:80px;bottom:78px;font-family:Consolas,monospace;font-size:20px;color:#9fb2ab}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<img class="big" src="../../public/icon.png" alt="">
<div class="wrap">
  <div class="brand"><img src="../../public/icon.png" alt="">CLAUDEX</div>
  <h1>Uma equipe de IA trabalhando <span>direto na sua pasta.</span></h1>
  <div class="chips"><span class="chip c1">CLAUDE CODE</span><span class="chip c2">CODEX</span><span class="chip c3">JEV</span></div>
</div>
<div class="url">Assinatura ou API · sem Git</div>
</body></html>
